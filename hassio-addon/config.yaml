name: Homenet2MQTT
version: 3.3.0
breaking_versions: [2.0.0]
slug: h2m
description: Bridge between RS485 HomeNet devices and MQTT (supports multi-port/topic mapping).
url: https://github.com/wooooooooooook/homenet2mqtt
arch:
  - aarch64
  - amd64
startup: application
boot: auto
image: "nubiz/homenet2mqtt"
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
hassio_role: default
init: false
hassio_api: true
auth_api: true
uart: true
services:
  - mqtt:need
options:
  log_level: info
  mqtt_topic_prefix: homenet2mqtt
  discovery_enabled: true
  use_supervisor_mqtt: true
  mqtt_url: ""
  mqtt_need_login: true
  mqtt_user: ""
  mqtt_passwd: ""
  config_files: []
  timezone: "Asia/Seoul"
  agent_api_token: ""
  agent_allow_packet_send: false
schema:
  log_level: list(trace|debug|info|warn|error|fatal)
  use_supervisor_mqtt: bool
  mqtt_url: str?
  mqtt_need_login: bool
  mqtt_user: str?
  mqtt_passwd: str?
  mqtt_topic_prefix: str?
  discovery_enabled: bool
  config_files:
    - str
  timezone: str?
  agent_api_token: password?
  agent_allow_packet_send: bool?
ingress: true
ingress_port: 3000
ingress_stream: true
# Agent API port is optional; leave it unmapped unless an AI agent needs direct access.
ports:
  "3001/tcp": null
ports_description:
  "3001/tcp": Agent API (optional)
panel_icon: mdi:crop-landscape
