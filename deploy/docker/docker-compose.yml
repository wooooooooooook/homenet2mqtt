services:
  homenet2mqtt:
    image: nubiz/homenet2mqtt:latest
    container_name: homenet2mqtt
    environment:
      # MQTT 브로커 URL
      MQTT_URL: mqtt://localhost:1883
      # 웹 UI 포트
      PORT: '3000'
      # Agent API 사용 토글 (토큰·포트·패킷 전송 허용은 웹 UI에서 설정)
      AGENT_API_ENABLED: 'false'
      # 로그 레벨 (debug, info, warn, error)
      LOG_LEVEL: info
      # MQTT 인증 설정
      MQTT_NEED_LOGIN: 'false'
      MQTT_USER: ''
      MQTT_PASSWD: ''
      MQTT_TOPIC_PREFIX: homenet2mqtt
    volumes:
      # 설정 파일 볼륨 (UI 비밀번호 해시는 ./h2m-config/ui-auth.json, 에이전트 API 토큰/포트는 ./h2m-config/agent-api.json 에 저장됨)
      - ./h2m-config:/config
    # 시리얼 포트 장치 (필요한 경우 주석 해제)
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    ports:
      # 호스트 내부에서만 접근 허용 (외부 공개는 리버스 프록시 사용)
      # UI 최초 접속 시 비밀번호를 설정해야 합니다.
      - '127.0.0.1:3000:3000'
      # Agent API (Bearer 토큰 인증). AGENT_API_ENABLED=false면 포트가 열리지 않습니다.
      # UI에서 에이전트 포트(기본 3001)를 바꾸면 이 매핑도 함께 수정하세요.
      - '127.0.0.1:3001:3001'
    restart: unless-stopped
